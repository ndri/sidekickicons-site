# Deploys the prerendered site to Andri's VPS on every push to main (and on demand from the Actions tab).
# The build runs here on GitHub; only the static files in build/ reach the server. They are copied as the
# deploy-sidekickicons user, whose key can do nothing but rsync into /srv/www/sidekickicons.com (rrsync,
# forced on the server). Secrets: DEPLOY_SSH_KEY (that key), DEPLOY_KNOWN_HOSTS (the server's host key, so
# the connection is verified). Actions are pinned to commit SHAs; bump them on purpose.
# Server side: ~/Projects/vps-agent (services.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm vitest run

      - run: pnpm build

      - name: Deploy to the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlt --delete-delay --delay-updates --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            build/ deploy-sidekickicons@159.195.5.238:
          rm -f ~/.ssh/deploy_key

      - name: Check the live site
        run: |
          for p in / /icons /icons/crown /missing-heroicons /llms.txt /icons.json /sitemap.xml /svg/24/outline/crown.svg; do
            curl -fsS -o /dev/null -w "%{http_code} $p\n" "https://sidekickicons.com$p"
          done
